# HTTPS entrance only: include inside lumen.o.atdplus.cn's existing server block.
# Do NOT install this snippet in the downstream nginx on 172.16.3.34.
location = /adn-report {
    return 308 https://lumen.o.atdplus.cn/adn-report/;
}

location ^~ /adn-report/ {
    # No trailing slash: preserve /adn-report/ for the nginx on 172.16.3.34.
    proxy_pass http://172.16.3.34;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 21m;
    proxy_read_timeout 190s;
    proxy_send_timeout 190s;
}
